<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPersona</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>DevPersona</h1>
                <p class="subtitle">Powered by real conscience</p>
            </div>
            <span class="status">● Active now</span>
        </header>

        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">

            <div class="empty-state" id="emptyState">
                <p class="empty-title">Start a conversation</p>

                <div class="chips">
                    <button class="chip">Tell me about your projects</button>
                    <button class="chip">What are your strongest skills?</button>
                    <button class="chip">Explain AlumConnect</button>
                    <button class="chip">What did you do at Elevate Labs?</button>
                </div>
            </div>

        </main>

        <!-- Input Area -->
        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask about skills, projects, or experience..." 
            />
            <button id="sendBtn">Send</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
